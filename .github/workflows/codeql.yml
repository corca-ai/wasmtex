name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly published CodeQL queries catch latent issues even
    # without a code change. Monday 06:00 UTC.
    - cron: '0 6 * * 1'

# Cancel an in-progress scan when a newer commit lands on the same ref.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          # `languages` (plural) is the correct input. The repo also contains C
          # sources under wasm-build/, so without an explicit language CodeQL would
          # auto-detect c-cpp and fail to build it — scope the scan to JS/TS only.
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      # JavaScript/TypeScript is interpreted — CodeQL extracts it without a build,
      # so no autobuild step is needed.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
        with:
          category: /language:${{ matrix.language }}
