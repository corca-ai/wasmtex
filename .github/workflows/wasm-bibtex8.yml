name: WASM bibtex8 (from source)

# Builds bibtex8 (texk/bibtex-x, 8-bit BibTeX) to WASM from the pinned texlive-source
# (#102). Plain C — no native phase — single Docker build + run.
on:
  workflow_dispatch:
    inputs:
      texlive_year:
        description: TeX Live engine year
        required: true
        type: choice
        default: '2025'
        options: ['2025', '2026']
      mirror_revision:
        description: Byte-derived immutable mirror revision
        required: false
        type: string
      provenance_sha256:
        description: SHA-256 of the mirror provenance manifest
        required: false
        type: string
      texlive_url:
        description: Exact immutable package-mirror URL qualified with this build
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'wasm-build/Dockerfile.bibtex8'
      - 'wasm-build/build-bibtex8.sh'
      - 'wasm-build/bibtex8-entry.c'
      - 'wasm-build/bibtex8-worker.js'
      - 'wasm-build/kpse-hook.c'
      - 'wasm-build/library.js'
      - 'wasm-build/texlive-source-*.ref'
      - 'scripts/gen-engine-build-receipt.mjs'
      - 'scripts/lib/engine-build-receipt.mjs'
      - 'scripts/corresponding-source-2025.json'
      - 'scripts/corresponding-source-2026.json'
      - 'scripts/check-annual-engine-source.mjs'
  pull_request:
    paths:
      - 'wasm-build/Dockerfile.bibtex8'
      - 'wasm-build/build-bibtex8.sh'
      - 'wasm-build/bibtex8-entry.c'
      - 'wasm-build/bibtex8-worker.js'
      - 'wasm-build/kpse-hook.c'
      - 'wasm-build/library.js'
      - 'wasm-build/texlive-source-*.ref'

jobs:
  build-bibtex8:
    runs-on: ubuntu-latest
    env:
      TEXLIVE_YEAR: ${{ inputs.texlive_year || '2025' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve immutable build mirror
        env:
          INPUT_TEXLIVE_URL: ${{ inputs.texlive_url }}
          INPUT_MIRROR_REVISION: ${{ inputs.mirror_revision }}
          INPUT_PROVENANCE_SHA256: ${{ inputs.provenance_sha256 }}
        run: node scripts/configure-engine-build-mirror.mjs

      - name: Verify source licensing policy
        run: node scripts/check-annual-engine-source.mjs "$TEXLIVE_YEAR"

      - name: Verify release policy for the established 2025 line
        if: env.TEXLIVE_YEAR == '2025' && github.event.repository.visibility == 'public'
        run: node scripts/check-license-compliance.mjs 2025 --release

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -f wasm-build/Dockerfile.bibtex8 \
            --build-arg TEXLIVE_REF=$(cat "wasm-build/texlive-source-$TEXLIVE_YEAR.ref") \
            -t bibtex8-wasm \
            wasm-build/

      - name: Run WASM build
        run: |
          mkdir -p wasm-build/dist-bibtex8
          docker run --platform linux/amd64 \
            -v ${{ github.workspace }}/wasm-build/dist-bibtex8:/dist \
            bibtex8-wasm

      - uses: actions/setup-node@v7
        with: { node-version: 24 }

      - name: Smoke test (WASM validity + entry export + own glue)
        run: |
          node -e "
            const fs = require('fs');
            const d = 'wasm-build/dist-bibtex8/';
            const w = fs.readFileSync(d + 'wasmtex-bibtex8.wasm');
            if (!WebAssembly.validate(w)) { console.error('INVALID wasm'); process.exit(1); }
            console.log('wasmtex-bibtex8.wasm OK (' + w.length + ' bytes)');
            const js = fs.readFileSync(d + 'wasmtex-bibtex8.js', 'utf8');
            const controller = fs.readFileSync(d + 'wasmtex-bibtex8.worker.js', 'utf8');
            for (const s of ['_compileBibtex8', '_setMainEntry']) {
              if (!js.includes(s)) { console.error('missing symbol: ' + s); process.exit(1); }
            }
            for (const s of ['kpse_find_file_impl', 'importScripts']) {
              if (!controller.includes(s)) { console.error('missing controller symbol: ' + s); process.exit(1); }
            }
            console.log('entry + hook symbols present');
          "

      - name: Record exact BibTeX8 build inputs and outputs
        run: |
          node scripts/gen-engine-build-receipt.mjs \
            bibtex8 wasm-build/dist-bibtex8 wasm-build/dist-bibtex8/BUILD-RECEIPT.bibtex8.json \
            wasmtex-bibtex8.js wasmtex-bibtex8.worker.js wasmtex-bibtex8.wasm

      - name: Upload bibtex8 WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TEXLIVE_YEAR == '2026' && 'wasm-bibtex8-2026' || 'wasm-bibtex8' }}
          path: |
            wasm-build/dist-bibtex8/wasmtex-bibtex8.js
            wasm-build/dist-bibtex8/wasmtex-bibtex8.worker.js
            wasm-build/dist-bibtex8/wasmtex-bibtex8.wasm
            wasm-build/dist-bibtex8/BUILD-RECEIPT.bibtex8.json
          retention-days: 90

      - name: Upload non-release BibTeX8 link-map evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TEXLIVE_YEAR == '2026' && 'wasm-bibtex8-2026-link-map' || 'wasm-bibtex8-link-map' }}
          path: wasm-build/dist-bibtex8/wasmtex-bibtex8.map
          retention-days: 90

      - name: List build outputs
        if: always()
        run: ls -lh wasm-build/dist-bibtex8/ 2>/dev/null || echo "No dist files"
