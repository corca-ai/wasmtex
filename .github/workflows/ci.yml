name: CI
on:
  push:
    branches: [main, 'iter4-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # The published library bundle (`lib/`) is committed so `github:` installs resolve
  # `exports` without a build step (#146). Rebuild it and fail if it drifts from `src/`,
  # with an actionable message. build:lib needs no engine assets, so this is a fast,
  # standalone gate. Output is deterministic (no sourcemaps / absolute paths; same node 24).
  lib-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm run check:licenses
      - run: npm run check:licenses:2026
      # Plain `npm ci` (not --ignore-scripts): esbuild's postinstall fetches its binary,
      # which build:lib needs. `npm ci` also runs `prepare` (build:lib); the explicit run
      # below is idempotent and keeps the intent obvious.
      - run: npm ci
      - run: npm run build:lib
      - name: Verify committed lib/ is up to date
        run: |
          if ! git diff --quiet -- lib; then
            echo "::error::Committed lib/ is stale — run 'npm run build:lib' and commit lib/."
            git --no-pager diff --stat -- lib
            exit 1
          fi

  # Unit-test coverage (Vitest + v8), reporting-only — no threshold gate yet.
  # The unit suite needs no engine assets, so this is a fast, standalone job; the
  # HTML/lcov report is uploaded as an artifact and the text summary lands in the log.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm run check:licenses
      - run: npm run check:licenses:2026
      - run: npm ci
      # A release is an explicit composition of receipt-bound workflow runs.
      # Never let an unrelated newer successful run silently replace a family.
      - name: Download pinned TeX Live 2025 engine release
        uses: ./.github/actions/download-engine-release
        with:
          texlive-year: '2025'
          destination: public/wasmtex/2025
          github-token: ${{ github.token }}
      - name: Download pinned TeX Live 2026 engine release
        uses: ./.github/actions/download-engine-release
        with:
          texlive-year: '2026'
          destination: public/wasmtex/2026
          github-token: ${{ github.token }}
      - run: npm run lint
      - run: npx tsgo --noEmit
      - run: npm run test
      - run: npm run test:license-tools
      - run: npm run check:engine-performance
      - run: npm run check:engine-performance:2026
      # Emit a content-hashed manifest of the (just-downloaded) engine assets so
      # `vite build` copies it into dist and consumers can sync/verify against it.
      - name: Generate development asset manifest
        if: github.ref != 'refs/heads/main'
        run: |
          node scripts/gen-asset-manifest.mjs 2025
          node scripts/gen-asset-manifest.mjs 2026
      # A Pages deploy distributes the engine files to browsers. Refuse a main-branch
      # deploy until the per-version license manifest records complete
      # corresponding source and has no unresolved component-license blocker.
      - name: Verify and generate releasable asset manifest
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/check-release-notices.mjs --assets public/wasmtex/2025 --release
          node scripts/gen-asset-manifest.mjs 2025 --release
          node scripts/check-release-notices.mjs --assets public/wasmtex/2026 --release
          node scripts/gen-asset-manifest.mjs 2026 --release
      - run: npx vite build
        env:
          BASE_URL: /${{ github.event.repository.name }}/
      - run: node scripts/check-release-notices.mjs --assets public/wasmtex/2025 --demo dist
      - run: node scripts/check-release-notices.mjs --assets public/wasmtex/2026 --demo dist
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with: { path: dist }

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
