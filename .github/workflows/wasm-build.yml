name: WASM Build
on:
  workflow_dispatch:
    inputs:
      texlive_year:
        description: TeX Live engine year
        required: true
        type: choice
        default: '2025'
        options: ['2025', '2026']
      texlive_url:
        description: Exact immutable package-mirror URL used to build formats
        required: false
        type: string
      mirror_revision:
        description: Byte-derived immutable mirror revision
        required: false
        type: string
      provenance_sha256:
        description: SHA-256 of the mirror provenance manifest
        required: false
        type: string
  push:
    branches: [main, 'iter4-*', 'feat/semantic-trace', 'feat/texlive-2025-upgrade']
    # This builds pdfTeX + BibTeX only. Exclude the other engines' glue so a
    # XeTeX/LuaTeX-only change doesn't needlessly rebuild pdfTeX/BibTeX (those
    # engines have their own workflows: wasm-xetex.yml, wasm-luatex.yml).
    paths:
      - 'wasm-build/**'
      - '!wasm-build/luatex-*'
      - '!wasm-build/Dockerfile.luatex'
      - '!wasm-build/build-luatex.sh'
      - '!wasm-build/xetex-*'
      - 'scripts/gen-engine-build-receipt.mjs'
      - 'scripts/lib/engine-build-receipt.mjs'
      - 'scripts/corresponding-source-2025.json'
      - 'scripts/corresponding-source-2026.json'
      - 'scripts/check-annual-engine-source.mjs'
      - 'scripts/lib/annual-engine-source.mjs'

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    env:
      TEXLIVE_YEAR: ${{ inputs.texlive_year || '2025' }}
      TEXLIVE_URL: ${{ inputs.texlive_url || (inputs.texlive_year == '2026' && 'https://texlive.corca.ai/snapshots/2026-b4f6befbe7732169/2026/' || 'https://texlive.corca.ai/snapshots/2025-0d3fc73b65e39905/2025/') }}
      TEXLIVE_MIRROR_REVISION: ${{ inputs.mirror_revision || (inputs.texlive_year == '2026' && '2026-b4f6befbe7732169' || '2025-0d3fc73b65e39905') }}
      TEXLIVE_PROVENANCE_SHA256: ${{ inputs.provenance_sha256 || (inputs.texlive_year == '2026' && 'e3de2b970525f1a39e5d97da4ce1c3bbee4c16ecc78b9cc6fe1131c3020f5307' || 'f43c385400b1f5ecdc8708ee73519ddcd618a13d649dccfde86ceea6f3534697') }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify source licensing policy
        run: node scripts/check-annual-engine-source.mjs "$TEXLIVE_YEAR"

      - name: Verify release policy for the established 2025 line
        if: env.TEXLIVE_YEAR == '2025' && github.event.repository.visibility == 'public'
        run: node scripts/check-license-compliance.mjs 2025 --release

      - uses: docker/setup-buildx-action@v4

      - uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: wasm-docker-${{ hashFiles('wasm-build/Dockerfile') }}
          restore-keys: wasm-docker-

      - name: Build Docker image (Phase 1 cached)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --build-arg TEXLIVE_REF=$(cat "wasm-build/texlive-source-$TEXLIVE_YEAR.ref") \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t pdftex-wasm \
            wasm-build/

      - name: Run WASM build (Phase 2)
        run: |
          mkdir -p wasm-build/dist
          docker run --platform linux/amd64 \
            -v ${{ github.workspace }}/wasm-build/dist:/dist \
            pdftex-wasm

      - name: Rotate Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - uses: actions/setup-node@v7
        with: { node-version: 24 }

      - name: Record raw 2026 pdfTeX and BibTeX build evidence
        if: env.TEXLIVE_YEAR == '2026'
        run: |
          node -e "const fs=require('fs'); for (const name of ['wasmtex-pdftex','wasmtex-bibtex']) { const bytes=fs.readFileSync('wasm-build/dist/'+name+'.wasm'); if (!WebAssembly.validate(bytes)) process.exit(1); }"
          node scripts/gen-engine-build-receipt.mjs \
            pdftex wasm-build/dist wasm-build/dist/BUILD-RECEIPT.pdftex-raw.json \
            wasmtex-pdftex.js wasmtex-pdftex.worker.js wasmtex-pdftex.wasm \
            wasmtex-kpse-resolve.js
          node scripts/gen-engine-build-receipt.mjs \
            bibtex wasm-build/dist wasm-build/dist/BUILD-RECEIPT.bibtex-raw.json \
            wasmtex-bibtex.js wasmtex-bibtex.worker.js wasmtex-bibtex.wasm

      - name: Upload raw 2026 pdfTeX and BibTeX build evidence
        if: env.TEXLIVE_YEAR == '2026'
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pdftex-bibtex-2026-raw
          path: |
            wasm-build/dist/wasmtex-pdftex.*
            wasm-build/dist/wasmtex-bibtex.*
            wasm-build/dist/wasmtex-kpse-resolve.js
            wasm-build/dist/BUILD-RECEIPT.*-raw.json
          retention-days: 90

      - name: Extract prebuilt pdfLaTeX format (.fmt)
        timeout-minutes: 10
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: |
          npm ci
          npx playwright install-deps chromium
          mkdir -p "public/wasmtex/$TEXLIVE_YEAR"
          cp wasm-build/dist/wasmtex-pdftex.js \
             wasm-build/dist/wasmtex-pdftex.worker.js \
             wasm-build/dist/wasmtex-pdftex.wasm \
             wasm-build/dist/wasmtex-kpse-resolve.js "public/wasmtex/$TEXLIVE_YEAR/"
          node scripts/extract-format.mjs "$TEXLIVE_YEAR"
          cp "public/wasmtex/$TEXLIVE_YEAR/wasmtex-pdftex.fmt" \
             wasm-build/dist/wasmtex-pdftex.fmt
          ls -lh wasm-build/dist/wasmtex-pdftex.fmt

      - name: Smoke test pdfTeX WASM
        run: |
          node -e "
            const fs = require('fs');
            const wasm = fs.readFileSync('wasm-build/dist/wasmtex-pdftex.wasm');
            if (!WebAssembly.validate(wasm)) process.exit(1);
            console.log('pdfTeX WASM OK (' + wasm.length + ' bytes)');
            const core = fs.readFileSync('wasm-build/dist/wasmtex-pdftex.js', 'utf8');
            const controller = fs.readFileSync('wasm-build/dist/wasmtex-pdftex.worker.js', 'utf8');
            const required = ['_scanHashTable', '_compileLaTeX', '_compileFormat', '_main', '_setMainEntry'];
            const missing = required.filter(s => !core.includes(s));
            if (missing.length) { console.error('Missing interposition/entry symbols: ' + missing.join(', ')); process.exit(1); }
            for (const token of ['kpse_find_file_impl', 'texlive_endpoint', 'importScripts']) {
              if (!controller.includes(token)) { console.error('Missing controller token: ' + token); process.exit(1); }
            }
            console.log('core exports and controller hooks present');
          "

      - name: Smoke test BibTeX WASM
        id: bibtex-smoke
        run: |
          node -e "
            const fs = require('fs');
            const wasm = fs.readFileSync('wasm-build/dist/wasmtex-bibtex.wasm');
            if (!WebAssembly.validate(wasm)) process.exit(1);
            console.log('BibTeX WASM OK (' + wasm.length + ' bytes)');
            const core = fs.readFileSync('wasm-build/dist/wasmtex-bibtex.js', 'utf8');
            const controller = fs.readFileSync('wasm-build/dist/wasmtex-bibtex.worker.js', 'utf8');
            if (!core.includes('_compileBibtex')) { console.error('Missing _compileBibtex'); process.exit(1); }
            if (!controller.includes('compileBibtexRoutine') || !controller.includes('importScripts')) {
              console.error('Missing BibTeX controller hooks'); process.exit(1);
            }
            console.log('BibTeX core exports and controller hooks present');
          "

      - name: Record exact pdfTeX build inputs and outputs
        run: |
          node scripts/gen-engine-build-receipt.mjs \
            pdftex wasm-build/dist wasm-build/dist/BUILD-RECEIPT.pdftex.json \
            wasmtex-pdftex.js wasmtex-pdftex.worker.js wasmtex-pdftex.wasm \
            wasmtex-kpse-resolve.js wasmtex-pdftex.fmt

      - name: Record exact BibTeX build inputs and outputs
        run: |
          node scripts/gen-engine-build-receipt.mjs \
            bibtex wasm-build/dist wasm-build/dist/BUILD-RECEIPT.bibtex.json \
            wasmtex-bibtex.js wasmtex-bibtex.worker.js wasmtex-bibtex.wasm

      - name: Upload pdfTeX WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TEXLIVE_YEAR == '2025' && 'wasm-pdftex' || 'wasm-pdftex-2026' }}
          path: |
            wasm-build/dist/wasmtex-pdftex.js
            wasm-build/dist/wasmtex-pdftex.worker.js
            wasm-build/dist/wasmtex-pdftex.wasm
            wasm-build/dist/wasmtex-pdftex.fmt
            wasm-build/dist/wasmtex-kpse-resolve.js
            wasm-build/dist/BUILD-RECEIPT.pdftex.json
          retention-days: 90

      - name: Upload BibTeX WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TEXLIVE_YEAR == '2025' && 'wasm-bibtex' || 'wasm-bibtex-2026' }}
          path: |
            wasm-build/dist/wasmtex-bibtex.js
            wasm-build/dist/wasmtex-bibtex.worker.js
            wasm-build/dist/wasmtex-bibtex.wasm
            wasm-build/dist/BUILD-RECEIPT.bibtex.json
          retention-days: 90

      - name: Upload non-release pdfTeX/BibTeX link-map evidence
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pdftex-bibtex-link-maps
          path: |
            wasm-build/dist/wasmtex-pdftex.map
            wasm-build/dist/wasmtex-bibtex.map
          retention-days: 90

      - name: List build outputs
        if: always()
        run: ls -lh wasm-build/dist/ 2>/dev/null || echo "No dist files"
