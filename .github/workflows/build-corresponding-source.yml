name: Build corresponding source

on:
  pull_request:
    paths:
      - '.github/workflows/build-corresponding-source.yml'
      - 'LICENSES/**'
      - 'docs/license-evidence/**'
      - 'public/wasmtex/2025/LICENSE-MANIFEST.json'
      - 'public/wasmtex/2026/LICENSE-MANIFEST.json'
      - 'scripts/build-corresponding-source.mjs'
      - 'scripts/check-corresponding-source.mjs'
      - 'scripts/check-license-compliance.mjs'
      - 'scripts/corresponding-source-2025.json'
      - 'scripts/corresponding-source-2026.json'
      - 'scripts/engine-components-2025.json'
      - 'scripts/engine-components-2026.json'
      - 'scripts/engine-release-components.json'
      - 'scripts/lib/engine-release-components.mjs'
      - '.github/actions/download-engine-release/action.yml'
  workflow_dispatch:
    inputs:
      texlive_year:
        description: Annual TeX Live engine line
        required: true
        type: choice
        options: ['2025', '2026']
        default: '2026'
      publish:
        description: >-
          Attach the verified archive to its engine release. Off by default:
          a release is a distribution, and this is the step that makes one.
        required: false
        type: boolean
        default: false

permissions:
  # `contents` is write only so the publish step can attach the archive to its
  # engine release; every other path here reads.
  contents: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'write' || 'read' }}
  actions: read

jobs:
  source:
    runs-on: ubuntu-latest
    env:
      TEXLIVE_YEAR: ${{ inputs.texlive_year || '2026' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Download pinned annual engine release
        uses: ./.github/actions/download-engine-release
        with:
          texlive-year: ${{ env.TEXLIVE_YEAR }}
          destination: public/wasmtex/${{ env.TEXLIVE_YEAR }}
          github-token: ${{ github.token }}
      - name: Verify release inputs
        run: |
          node scripts/check-license-compliance.mjs "$TEXLIVE_YEAR"
          node scripts/gen-asset-manifest.mjs "$TEXLIVE_YEAR"
          node scripts/check-release-notices.mjs --assets "public/wasmtex/$TEXLIVE_YEAR"
      - name: Build and verify complete corresponding source
        run: |
          mkdir -p source-release
          node scripts/build-corresponding-source.mjs \
            --assets "public/wasmtex/$TEXLIVE_YEAR" \
            --output-dir source-release \
            --config "scripts/corresponding-source-$TEXLIVE_YEAR.json"
          archive="source-release/wasmtex-$(jq -r .releaseId public/wasmtex/$TEXLIVE_YEAR/manifest.json)-source.tar.xz"
          xz --test "$archive"
          node scripts/check-corresponding-source.mjs \
            "$archive" "public/wasmtex/$TEXLIVE_YEAR/manifest.json" \
            "scripts/corresponding-source-$TEXLIVE_YEAR.json"
      - uses: actions/upload-artifact@v7
        with:
          name: corresponding-source-${{ inputs.texlive_year || '2026' }}
          path: source-release/
          retention-days: 90
      # Recipients are entitled to the source for the exact bytes they were
      # given, so the archive belongs on the release that ships those bytes.
      # Building it here and attaching it by hand from another machine is how
      # it was done once; this closes that gap, and refuses rather than
      # replaces if the tag already carries an archive.
      - name: Publish to the engine release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(jq -r .releaseId "public/wasmtex/$TEXLIVE_YEAR/manifest.json")"
          tag="engine-$release_id"
          archive="source-release/wasmtex-$release_id-source.tar.xz"
          test -f "$archive"
          if gh release view "$tag" --json assets \
            --jq '.assets[].name' 2>/dev/null | grep -qx "$(basename "$archive")"; then
            echo "::error::$tag already carries $(basename "$archive"); a published release is immutable"
            exit 1
          fi
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "Engine $release_id" \
              --notes "Corresponding source for the TeX Live $TEXLIVE_YEAR engine release \`$release_id\`."
          gh release upload "$tag" "$archive" "$archive.sha256"
