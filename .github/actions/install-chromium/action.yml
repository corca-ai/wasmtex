name: Install Chromium
description: Install Playwright Chromium and its Ubuntu system dependencies
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Use the signed Ubuntu pockets directly. Region-selected mirrors and
        # the Azure mirror have both failed to transfer Noble font packages.
        sources=/etc/apt/sources.list.d/ubuntu.sources
        if [[ -f "$sources" ]]; then
          sudo sed -i -E 's|mirror\+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu|g; s|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://security\.ubuntu\.com/ubuntu|https://security.ubuntu.com/ubuntu|g' "$sources"
        fi
        if ! npx playwright install-deps chromium; then
          # Retry transport through the alternate mirror with the same signed
          # suites and package checksums. A second failure still fails the job.
          if [[ -f "$sources" ]]; then
            sudo sed -i -E 's|https?://(archive|security)\.ubuntu\.com/ubuntu|https://azure.archive.ubuntu.com/ubuntu|g' "$sources"
          fi
          npx playwright install-deps chromium
        fi
        npx playwright install chromium
